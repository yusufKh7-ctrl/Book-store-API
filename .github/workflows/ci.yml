name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d bookstore_test" --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/bookstore_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/bookstore_test
      SECRET_KEY: testsecretkey123456789012345678901234567890
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DATABASE_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v